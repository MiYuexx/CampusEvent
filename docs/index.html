<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusEvent 校园活动报名与管理系统</title>
  <style>
    :root {
      --primary: #4f6df5;
      --primary-dark: #3b55d9;
      --bg: #eef1f9;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #7a8194;
      --line: #e7eaf2;
      --green: #16a34a;
      --green-bg: #e8f7ee;
      --orange: #d97706;
      --orange-bg: #fef3e2;
      --blue-bg: #eef3ff;
      --gray-bg: #f1f3f7;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(79,109,245,.10);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
      margin: 0;
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(79,109,245,.18), transparent 60%),
        radial-gradient(900px 400px at -10% 20%, rgba(124,92,246,.14), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(120deg, #4f6df5 0%, #7c5cf6 55%, #9b6df7 100%);
      color: #fff;
      padding: 26px 24px 42px;
    }
    .header-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: .5px; }
    header p { margin: 0; opacity: .88; font-size: 14px; }
    .role-box { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.16); padding: 8px 12px; border-radius: 12px; }
    .role-box select, .role-box input { background: rgba(255,255,255,.92); border: none; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
    main { max-width: 1000px; margin: -22px auto 40px; padding: 0 16px; }
    section {
      background: var(--card); border-radius: var(--radius); padding: 22px; margin-bottom: 20px;
      box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.7);
    }
    h2 { margin: 0 0 16px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
    h2::before { content: ""; width: 8px; height: 18px; border-radius: 6px; background: linear-gradient(var(--primary), #7c5cf6); }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input, select, button {
      padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s, transform .1s;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,109,245,.15); }
    input { min-width: 130px; }
    button { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 500; margin-right: 6px; }
    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.secondary { background: #eef0f6; color: var(--text); }
    button.secondary:hover { background: #e2e6f0; }
    button.ghost { background: transparent; color: var(--primary); border: 1px solid #d6defc; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { padding: 12px 10px; font-size: 14px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12.5px; letter-spacing: .3px; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: #f7f9ff; }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pending { background: var(--orange-bg); color: var(--orange); }
    .approved { background: var(--green-bg); color: var(--green); }
    .rejected, .cancelled { background: var(--gray-bg); color: var(--muted); }
    .waiting { background: var(--blue-bg); color: var(--primary-dark); }
    .policy { font-size: 12.5px; color: var(--primary-dark); background: #eef1ff; padding: 3px 10px; border-radius: 8px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .stat-card { flex: 1; min-width: 120px; background: #f7f9ff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat-card .num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
    .stat-card .label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .bars { margin-top: 16px; display: grid; gap: 12px; }
    .bar-row { display: grid; grid-template-columns: 110px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-track { background: #eef1f7; border-radius: 999px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #7c5cf6); }
    .msg { color: var(--muted); font-size: 13px; line-height: 1.9; margin-top: 12px; }
    .msg .item { background: #f7f9ff; border-left: 3px solid var(--primary); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .msg .item.unread { background: #eef3ff; font-weight: 500; }
    .tip { font-size: 12px; color: var(--muted); margin-top: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 13px; }
    .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: #1f2329; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .selected-row { background: #eef3ff !important; }
    .modal-mask { position: fixed; inset: 0; background: rgba(20,25,40,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-mask.show { display: flex; }
    .modal { background: #fff; border-radius: 18px; max-width: 520px; width: 100%; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal h3 { margin: 0 0 14px; }
    .detail-grid { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; font-size: 14px; }
    .detail-grid .k { color: var(--muted); }
    .modal-actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .badge-count { background: var(--orange); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; margin-left: 6px; }
    @media (max-width: 640px) {
      header { padding: 20px 18px 34px; }
      main { margin-top: -16px; }
      section { padding: 16px; }
      input { min-width: 100%; }
      .form-row, .filters { flex-direction: column; align-items: stretch; }
      button { margin-right: 0; }
      th:nth-child(3), td:nth-child(3) { display: none; }
      .bar-row { grid-template-columns: 84px 1fr 44px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>CampusEvent 校园活动报名与管理系统</h1>
      <p>活动发布 · 在线报名 · 审核审批 · 站内通知，一站式校园活动管理演示</p>
    </div>
    <div class="role-box">
      <select id="role" onchange="switchRole()">
        <option value="student">学生</option>
        <option value="admin">管理员</option>
      </select>
      <input id="currentUser" placeholder="账号，如 s001" oninput="render()">
    </div>
  </div>
</header>
<main>
  <section id="adminPanel" style="display:none">
    <h2>新建活动（管理员）</h2>
    <div class="form-row">
      <input id="title" placeholder="活动名称">
      <input id="category" placeholder="类别">
      <input id="location" placeholder="地点">
      <input id="start_at" type="date">
      <input id="capacity" type="number" placeholder="人数上限" min="1">
      <select id="policy_type">
        <option value="DIRECT">直接报名</option>
        <option value="REVIEW">管理员审核</option>
      </select>
      <button onclick="createActivity()">创建活动</button>
    </div>
    <div class="tip">仅管理员可见并可创建活动；学生端只能浏览与报名。</div>
  </section>

  <section>
    <h2>活动列表</h2>
    <div class="filters">
      <input id="keyword" placeholder="按名称筛选" style="min-width:180px" oninput="render()">
      <select id="filterPolicy" onchange="render()">
        <option value="">全部报名方式</option>
        <option value="DIRECT">直接报名</option>
        <option value="REVIEW">审核型</option>
      </select>
      <select id="filterStatus" onchange="render()">
        <option value="">全部名额状态</option>
        <option value="open">有名额</option>
        <option value="full">已满员</option>
      </select>
    </div>
    <div class="stats" id="globalStats"></div>
    <div class="bars" id="capacityBars"></div>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>方式</th><th>地点</th><th>时间</th><th>已通过</th><th>待审核/候补</th><th>剩余名额</th><th>操作</th></tr></thead>
      <tbody id="activityBody"></tbody>
    </table>
  </section>

  <section>
    <h2>报名 / 审批操作 <span id="pendingBadge" class="badge-count" style="display:none">0</span></h2>
    <div class="filters">
      <input id="regKeyword" placeholder="按学生/活动筛选" oninput="render()">
      <select id="regStatus" onchange="render()">
        <option value="">全部状态</option>
        <option value="PENDING">待审核</option>
        <option value="APPROVED">已通过</option>
        <option value="REJECTED">已拒绝</option>
        <option value="CANCELLED">已取消</option>
        <option value="WAITING">候补</option>
      </select>
    </div>
    <table>
      <thead><tr><th>报名ID</th><th>活动ID</th><th>学生</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
      <tbody id="registrationBody"></tbody>
    </table>
  </section>

  <section>
    <h2>站内消息</h2>
    <div class="form-row">
      <button class="secondary" onclick="loadMessages()">刷新我的消息</button>
      <button class="ghost" onclick="markAllRead()">全部标为已读</button>
    </div>
    <div id="messageBox" class="msg"></div>
  </section>
</main>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>活动详情</h3>
    <div id="detailBody" class="detail-grid"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY = "campusevent-demo-v2";
let state = load() || seed();

function seed() {
  return {
    activities: [
      { activity_id: 1, title: "迎新晚会", category: "文艺", location: "大礼堂", start_at: "2026-12-10", capacity: 2, policy_type: "DIRECT" },
      { activity_id: 2, title: "志愿者招募", category: "公益", location: "学生活动中心", start_at: "2026-12-05", capacity: 3, policy_type: "REVIEW" }
    ],
    registrations: [],
    messages: [],
    seq: 100
  };
}
function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

const activities = () => state.activities;
const registrations = () => state.registrations;
const messages = () => state.messages;
let selectedActivity = null;

function now() { return new Date().toLocaleString("zh-CN", { hour12: false }); }
function approvedCount(aid) { return registrations().filter(r => r.activity_id === aid && r.status === "APPROVED").length; }
function pendingCount(aid) { return registrations().filter(r => ["PENDING","WAITING"].includes(r.status)).length; }
function hasActive(aid, sid) { return registrations().some(r => r.activity_id === aid && r.student_id === sid && ["PENDING","APPROVED","WAITING"].includes(r.status)); }
function currentUser() { return document.getElementById("currentUser").value.trim(); }
function role() { return document.getElementById("role").value; }

function pushMessage(sid, aid, content) {
  if (!messages().some(m => m.student_id === sid && m.activity_id === aid && m.content === content)) {
    messages().push({ message_id: messages().length + 1, student_id: sid, activity_id: aid, content, read: false, time: now() });
  }
}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800);
}
function policyLabel(p) { return p === "DIRECT" ? "直接报名" : p === "REVIEW" ? "审核型" : "年级限定"; }
function statusLabel(s) { return { PENDING:"待审核", APPROVED:"已通过", REJECTED:"已拒绝", CANCELLED:"已取消", WAITING:"候补" }[s] || s; }

function switchRole() {
  document.getElementById("adminPanel").style.display = role() === "admin" ? "" : "none";
  render();
}

function createActivity() {
  if (role() !== "admin") { toast("仅管理员可创建活动"); return; }
  const title = document.getElementById("title").value.trim();
  const capacity = Number(document.getElementById("capacity").value);
  if (!title) { toast("活动名称不能为空"); return; }
  if (!(capacity > 0)) { toast("人数上限必须为正整数"); return; }
  state.seq += 1;
  activities().push({
    activity_id: state.seq, title,
    category: document.getElementById("category").value,
    location: document.getElementById("location").value,
    start_at: document.getElementById("start_at").value,
    capacity, policy_type: document.getElementById("policy_type").value
  });
  save(); toast("活动创建成功"); render();
}

function registerSelected() {
  if (!selectedActivity) { toast("请先选择活动"); return; }
  const sid = currentUser();
  if (!sid) { toast("请输入学生账号"); return; }
  const act = activities().find(a => a.activity_id === selectedActivity);
  if (hasActive(act.activity_id, sid)) { toast("该活动已有有效报名，请勿重复报名"); return; }
  const approved = approvedCount(act.activity_id);
  let status;
  if (act.policy_type === "DIRECT") {
    if (approved >= act.capacity) { status = "WAITING"; pushMessage(sid, act.activity_id, `《${act.title}》名额已满，你已进入候补名单。`); }
    else { status = "APPROVED"; pushMessage(sid, act.activity_id, `你报名的活动《${act.title}》已通过。`); }
  } else {
    status = "PENDING"; pushMessage(sid, act.activity_id, `你报名的活动《${act.title}》已提交，等待管理员审核。`);
  }
  state.seq += 1;
  registrations().push({ registration_id: state.seq, activity_id: act.activity_id, student_id: sid, status, time: now() });
  save();
  toast(status === "APPROVED" ? "报名已通过" : status === "WAITING" ? "已进入候补" : "报名已提交，等待审核");
  render();
}

function review(id, approve) {
  if (role() !== "admin") { toast("仅管理员可审批"); return; }
  const r = registrations().find(x => x.registration_id === id);
  if (!r || r.status !== "PENDING") return;
  const act = activities().find(a => a.activity_id === r.activity_id);
  const approved = approvedCount(act.activity_id);
  if (approve && approved >= act.capacity) { toast("名额已满，批准失败"); return; }
  r.status = approve ? "APPROVED" : "REJECTED";
  r.time = now();
  pushMessage(r.student_id, act.activity_id, approve
    ? `你的报名《${act.title}》已被管理员批准。`
    : `你的报名《${act.title}》未通过审核。`);
  if (!approve) promoteWaiting(act.activity_id);
  save(); toast(approve ? "已批准该报名" : "已拒绝该报名"); render();
}

function promoteWaiting(aid) {
  const waiting = registrations().find(r => r.activity_id === aid && r.status === "WAITING");
  const act = activities().find(a => a.activity_id === aid);
  if (waiting && approvedCount(aid) < act.capacity) {
    waiting.status = "APPROVED"; waiting.time = now();
    pushMessage(waiting.student_id, aid, `候补顺位已补位，《${act.title}》报名已通过。`);
  }
}

function cancelReg(id) {
  const r = registrations().find(x => x.registration_id === id);
  if (!r || !["PENDING","APPROVED","WAITING"].includes(r.status)) return;
  const act = activities().find(a => a.activity_id === r.activity_id);
  r.status = "CANCELLED"; r.time = now();
  pushMessage(r.student_id, act.activity_id, `你已取消活动《${act.title}》的报名。`);
  promoteWaiting(act.activity_id);
  save(); toast("报名已取消"); render();
}

function selectActivity(id) { selectedActivity = id; toast("已选择活动 " + id); render(); }

function openDetail(id) {
  const a = activities().find(x => x.activity_id === id);
  if (!a) return;
  const regs = registrations().filter(r => r.activity_id === id);
  document.getElementById("detailBody").innerHTML = `
    <div class="k">名称</div><div>${a.title}</div>
    <div class="k">类别</div><div>${a.category || "—"}</div>
    <div class="k">地点</div><div>${a.location || "—"}</div>
    <div class="k">时间</div><div>${a.start_at || "—"}</div>
    <div class="k">报名方式</div><div><span class="policy">${policyLabel(a.policy_type)}</span></div>
    <div class="k">名额</div><div>${approvedCount(id)} / ${a.capacity} 已通过，候补/待审核 ${pendingCount(id)} 人</div>
    <div class="k">报名记录</div><div>${regs.length ? regs.map(r => `${r.student_id}（${statusLabel(r.status)}）`).join("、") : "暂无"}</div>`;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal() { document.getElementById("modalMask").classList.remove("show"); }

function renderStats() {
  const total = activities().length;
  const approved = registrations().filter(r => r.status === "APPROVED").length;
  const pending = registrations().filter(r => ["PENDING","WAITING"].includes(r.status)).length;
  const waiting = registrations().filter(r => r.status === "WAITING").length;
  document.getElementById("globalStats").innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">活动总数</div></div>
    <div class="stat-card"><div class="num">${approved}</div><div class="label">已通过报名</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="label">待审核/候补</div></div>
    <div class="stat-card"><div class="num">${waiting}</div><div class="label">候补人数</div></div>`;
  const bars = activities().map(a => {
    const used = approvedCount(a.activity_id);
    const pct = a.capacity ? Math.round(used / a.capacity * 100) : 0;
    return `<div class="bar-row"><div>${a.title}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div>${used}/${a.capacity}</div></div>`;
  }).join("");
  document.getElementById("capacityBars").innerHTML = bars || `<div class="empty">暂无活动</div>`;
}

function render() {
  const keyword = document.getElementById("keyword").value.trim();
  const fPolicy = document.getElementById("filterPolicy").value;
  const fStatus = document.getElementById("filterStatus").value;
  let list = activities().filter(a =>
    (!keyword || a.title.includes(keyword)) &&
    (!fPolicy || a.policy_type === fPolicy) &&
    (!fStatus || (fStatus === "full" ? approvedCount(a.activity_id) >= a.capacity : approvedCount(a.activity_id) < a.capacity))
  );
  const body = document.getElementById("activityBody");
  body.innerHTML = "";
  if (!list.length) body.innerHTML = `<tr><td colspan="9" class="empty">暂无匹配活动</td></tr>`;
  list.forEach(a => {
    const approved = approvedCount(a.activity_id);
    const remaining = Math.max(a.capacity - approved, 0);
    const tr = document.createElement("tr");
    if (a.activity_id === selectedActivity) tr.className = "selected-row";
    tr.innerHTML = `<td>${a.activity_id}</td><td>${a.title}</td>
      <td><span class="policy">${policyLabel(a.policy_type)}</span></td>
      <td>${a.location || "—"}</td><td>${a.start_at || "—"}</td>
      <td>${approved}</td><td>${pendingCount(a.activity_id)}</td><td>${remaining}</td>
      <td><button class="ghost" onclick="selectActivity(${a.activity_id})">选择</button>
          <button class="ghost" onclick="openDetail(${a.activity_id})">详情</button></td>`;
    body.appendChild(tr);
  });

  const regKw = document.getElementById("regKeyword").value.trim();
  const regStatus = document.getElementById("regStatus").value;
  let regs = registrations().filter(r =>
    (!regKw || r.student_id.includes(regKw) || String(r.activity_id).includes(regKw)) &&
    (!regStatus || r.status === regStatus)
  );
  const rb = document.getElementById("registrationBody");
  rb.innerHTML = "";
  if (!regs.length) rb.innerHTML = `<tr><td colspan="6" class="empty">暂无报名记录</td></tr>`;
  regs.forEach(r => {
    const tag = r.status.toLowerCase();
    const tr = document.createElement("tr");
    const ops = r.status === "PENDING" && role() === "admin"
      ? `<button onclick="review(${r.registration_id}, true)">批准</button><button class="secondary" onclick="review(${r.registration_id}, false)">拒绝</button>`
      : ["PENDING","APPROVED","WAITING"].includes(r.status)
        ? `<button class="secondary" onclick="cancelReg(${r.registration_id})">取消</button>`
        : `<span class="tip">—</span>`;
    tr.innerHTML = `<td>${r.registration_id}</td><td>${r.activity_id}</td><td>${r.student_id}</td>
      <td><span class="tag ${tag}">${statusLabel(r.status)}</span></td><td>${r.time || "—"}</td><td>${ops}</td>`;
    rb.appendChild(tr);
  });

  const pendingCountAdmin = registrations().filter(r => r.status === "PENDING").length;
  const badge = document.getElementById("pendingBadge");
  badge.style.display = pendingCountAdmin ? "" : "none";
  badge.textContent = pendingCountAdmin;

  renderStats();
}

function loadMessages() {
  const sid = currentUser();
  const list = messages().filter(m => !sid || m.student_id === sid);
  document.getElementById("messageBox").innerHTML = list.length
    ? list.map(m => `<div class="item ${m.read ? "" : "unread"}">· ${m.content}<div class="tip">${m.time || ""}${m.read ? " · 已读" : " · 未读"}</div></div>`).join("")
    : `<div class="empty">暂无消息</div>`;
}
function markAllRead() {
  const sid = currentUser();
  messages().forEach(m => { if (!sid || m.student_id === sid) m.read = true; });
  save(); loadMessages(); toast("已全部标为已读");
}

document.getElementById("adminPanel").style.display = "none";
render();
</script>
</body>
</html>
